name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  checks:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee build.txt

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.txt

      # Lint runs via the official action which posts results as inline PR annotations
      # on the diff — no separate installation or output capture needed.
      - name: Lint
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed"; }
          {
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Build | $(status "${{ steps.build.outcome }}") |"
            echo "| Test  | $(status "${{ steps.test.outcome }}") |"
            echo "| Lint  | $(status "${{ steps.lint.outcome }}") |"
            echo ""
            echo "### Build"
            echo '```'
            cat build.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo "### Test"
            echo '```'
            cat test.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v9
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');

            // GitHub PR comment hard limit is 65536 chars.
            // Each section gets a budget; if exceeded we keep head and tail so
            // failures (usually at the end) stay visible alongside the preamble.
            const SECTION_BUDGET = 10_000;

            function icon(outcome) {
              return outcome === 'success' ? '✅' : '❌';
            }

            function readTruncated(file, budget) {
              let text;
              try {
                text = fs.readFileSync(file, 'utf8').trim();
              } catch {
                return '*(no output)*';
              }
              if (text.length <= budget) return text;
              const half = Math.floor(budget / 2);
              const snip = `\n\n…*(truncated — [full output in Actions summary](${process.env.RUN_URL}))*\n\n`;
              return text.slice(0, half) + snip + text.slice(-half);
            }

            const build = readTruncated('build.txt', SECTION_BUDGET);
            const test  = readTruncated('test.txt',  SECTION_BUDGET);

            const lintDetail = process.env.LINT_OUTCOME === 'success'
              ? 'No issues found.'
              : `Issues found — see **inline annotations** on the diff above, or the [Actions run](${process.env.RUN_URL}) for details.`;

            const body = [
              '## PR Check Results',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Build | ${icon(process.env.BUILD_OUTCOME)} |`,
              `| Test  | ${icon(process.env.TEST_OUTCOME)} |`,
              `| Lint  | ${icon(process.env.LINT_OUTCOME)} |`,
              '',
              '<details><summary>Build output</summary>',
              '',
              '```',
              build,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Test output</summary>',
              '',
              '```',
              test,
              '```',
              '',
              '</details>',
              '',
              `**Lint:** ${lintDetail}`,
              '',
              `> Full output: [Actions run](${process.env.RUN_URL})`,
            ].join('\n');

            // Update an existing bot comment rather than posting a new one on each push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const MARKER = '## PR Check Results';
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Fail the job after the comment is posted so reviewers see context first.
      - name: Fail if any check failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "One or more checks failed."
            exit 1
          fi
